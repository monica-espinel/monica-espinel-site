<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Params.homeTitle }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  {{/* Phase 3: description, canonical, Open Graph, Twitter, robots, favicon, GA4. */}}
</head>
<body>
  {{ partial "header.html" . }}
  <main id="site-content">
    {{ block "main" . }}{{ end }}
  </main>
  <footer id="site-footer">
    <p>&copy; {{ now.Year }} <a href="{{ "/" | relURL }}">{{ site.Title }}</a></p>
  </footer>
</body>
</html>

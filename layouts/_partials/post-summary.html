<article class="post">
  <header>
    {{ with .GetTerms "categories" }}<div class="entry-categories">{{ range $i, $c := . }}{{ if $i }}, {{ end }}<a href="{{ $c.RelPermalink }}">{{ $c.LinkTitle }}</a>{{ end }}</div>{{ end }}
    <h2 class="entry-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <p class="post-meta"><span class="post-author">By {{ .Params.author }}</span> <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></p>
  </header>
  {{ with .Params.image }}<figure class="featured-media"><img src="{{ . | relURL }}" alt="{{ $.Params.image_alt }}" loading="lazy"></figure>{{ end }}
  <div class="entry-content">{{ .Summary }}</div>
</article>
